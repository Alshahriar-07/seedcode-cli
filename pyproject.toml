[build-system]
# hatchling >= 1.27 is needed for PEP 639 license expressions
# (license = "PolyForm-Noncommercial-1.0.0").
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "seedcode-cli"
description = "Seed Code — a premium terminal-based AI coding assistant. Plant ideas. Grow code."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Al Shahriar Sowan", email = "github@eagox.studio" }]
dynamic = ["version"]
keywords = ["ai", "cli", "terminal", "chat", "coding-assistant", "seedcode", "ollama", "agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.40.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-mock>=3.12.0"]
# v9.2.0 removed desktop control, OCR and DOM-level browser automation, so the
# former [desktop], [vision] and [browser] extras (and their heavy native
# dependencies) are gone. A dedicated coding agent needs only the core
# dependencies above plus the standard library.

[project.urls]
Homepage = "https://github.com/Alshahriar-07/seedcode-cli"
Repository = "https://github.com/Alshahriar-07/seedcode-cli"
Documentation = "https://github.com/Alshahriar-07/seedcode-cli#readme"
Issues = "https://github.com/Alshahriar-07/seedcode-cli/issues"
Changelog = "https://github.com/Alshahriar-07/seedcode-cli/releases"

[project.scripts]
seedcode = "seedcode.cli:main"

# Single source of truth for the version: seedcode/__init__.py (`__version__`).
# Bump it there and every consumer (wheel, sdist, CLI --version, installer,
# GitHub release, PyPI, WinGet manifest) picks it up.
[tool.hatch.version]
path = "seedcode/__init__.py"

# Safety net: refuse to build a wheel/sdist while the generated secret module
# (release-EXE-only, git-ignored) exists in the tree.
[tool.hatch.build.hooks.custom]
path = "scripts/pyproject_build_hook.py"
require-runtime-dependencies = false

# Pin Core Metadata 2.4 rather than letting hatchling emit its 2.5 default.
# Everything this project publishes is expressible in 2.4 (PEP 639's
# License-Expression / License-File landed in 2.4; only PEP 794's Import-Name /
# Import-Namespace need 2.5, and this distribution declares neither), while
# twine 6.x still *hard-caps* the metadata versions it accepts at 2.4 - it
# monkeypatches packaging._VALID_METADATA_VERSIONS to drop 2.5. The release
# workflow runs `python -m twine check dist/*` as a publish gate, so a 2.5
# wheel would fail its own release. 2.4 is the newest version the whole
# toolchain round-trips.
[tool.hatch.build.targets.wheel]
packages = ["seedcode"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
# The build hook ships in the sdist: pip rebuilds the wheel from the
# extracted sdist, and hatchling must be able to load the hook there.
include = ["seedcode", "scripts/pyproject_build_hook.py", "README.md", "LICENSE"]
core-metadata-version = "2.4"
