name: Release

# Builds a full release from a git tag:
#   1. tests
#   2. Python distributions (wheel + sdist) + twine check
#   3. Windows build pipeline (scripts\windows\build.bat): PyInstaller exe,
#      Inno Setup installer, and the staged dist\release\<version>\ directory
#      with SHA256SUMS.txt
#   4. GitHub Release with every v<version> artifact attached
#
# The attached artifact names follow scripts/windows/stage_release.py, which is
# what IRM_INSTALL/install.ps1 and IRM_INSTALL/install.sh download:
#   SeedCode-CLI-<version>-windows-x64.exe
#   SeedCode-CLI-Setup-<version>.exe
#   seedcode_cli-<version>-py3-none-any.whl
#   seedcode_cli-<version>.tar.gz
#   SHA256SUMS.txt   (checked by both installers before installing)
#
# Pushing a tag also triggers .github/workflows/publish.yml.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi:
    name: Build and check PyPI package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip and install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Verify CLI entry point
        run: |
          seedcode --version
          python -m seedcode --version

      - name: Build wheel and sdist
        run: python -m build

      - name: Check built distributions
        run: python -m twine check dist/*

      - name: Upload Python distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: pypi-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install build tooling
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build the installer (tests + PyInstaller + Inno Setup)
        run: scripts\windows\build.bat
        shell: cmd

      - name: Read source version
        id: version
        shell: powershell
        run: |
          $v = python -c "import seedcode; print(seedcode.__version__)"
          Write-Output "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: Verify the release artifacts match the source version
        shell: powershell
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $dir = "dist\release\$v"

          $expected = @("SeedCode-CLI-$v-windows-x64.exe", "SeedCode-CLI-Setup-$v.exe", "SHA256SUMS.txt")
          foreach ($name in $expected) {
            if (-not (Test-Path (Join-Path $dir $name))) {
              Write-Error "$dir\$name was not produced by the build pipeline"
              exit 1
            }
          }

          # The packaged exe must report this exact version (a running binary
          # is not proof: a stale build would also run).
          $reported = (& ".\dist\seedcode.exe" --version 2>&1 | Out-String).Trim()
          if ($reported -notlike "*$v*") {
            Write-Error "dist\seedcode.exe reported '$reported', not version $v"
            exit 1
          }
          Write-Host "Release artifacts verified for v$v ($reported)"

      - name: Upload the staged release directory
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/release/*/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [pypi, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Python distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: pypi-sdist
          path: dist

      - name: Download the staged Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: windows-release

      - name: Assemble the release asset directory
        shell: bash
        run: |
          set -euo pipefail
          # One flat directory holding every published artifact, so
          # SHA256SUMS.txt covers exactly what the release ships. Both remote
          # installers check their download against this file.
          mkdir -p assets
          find windows-release -type f ! -name SHA256SUMS.txt -exec cp {} assets/ \;
          shopt -s nullglob
          for f in dist/*.whl dist/*.tar.gz; do cp "$f" "assets/$(basename "$f")"; done
          # The staging step's own SHA256SUMS.txt only covers the Windows
          # files; regenerate it over the complete asset set.
          cd assets
          : > SHA256SUMS.txt
          for f in *; do
            [ "$f" = "SHA256SUMS.txt" ] && continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" >> SHA256SUMS.txt
            else
              shasum -a 256 "$f" >> SHA256SUMS.txt
            fi
          done
          echo "Release assets:"
          ls -1
          echo "Checksums:"
          cat SHA256SUMS.txt

      - name: Write release body
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          cat > release-body.md <<EOF
          ## Seed Code CLI $VERSION

          **Plant ideas. Grow code.**

          ### Official installation

          Windows:

          \`\`\`powershell
          irm https://seedcode-cli.vercel.app/install.ps1 | iex
          \`\`\`

          Linux:

          \`\`\`bash
          curl -fsSL https://seedcode-cli.vercel.app/install.sh | bash
          \`\`\`

          ### Assets
          - **Windows installer** — \`SeedCode-CLI-Setup-$VERSION.exe\` (one-click Inno Setup installer; installs to Program Files, adds \`seedcode\` to PATH, works with CMD, PowerShell, and Windows Terminal).
          - **Windows standalone** — \`SeedCode-CLI-$VERSION-windows-x64.exe\` (self-contained; no Python needed). This is the artifact the Windows remote installer downloads.
          - **Python distributions** — \`seedcode_cli-$VERSION-py3-none-any.whl\` and \`seedcode_cli-$VERSION.tar.gz\`. The wheel is the artifact the Linux remote installer downloads.
          - \`SHA256SUMS.txt\` — SHA256 checksums for every artifact above. Both remote installers verify against this file before installing.

          ### Verify

          \`\`\`bash
          seedcode --version
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          draft: false
          prerelease: false
          files: assets/*